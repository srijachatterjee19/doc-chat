services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_db
      - uploads_data:/app/uploads
      - history_data:/app/history
      - budget_data:/app/budget
    restart: unless-stopped

volumes:
  chroma_data:
  uploads_data:
  history_data:
  budget_data:
